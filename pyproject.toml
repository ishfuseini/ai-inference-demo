[project]
name = "openrouter-production-inference-lab"
version = "0.1.0"
description = "Local OpenRouter production inference demo lab."
requires-python = ">=3.12"
dependencies = [
    "nicegui>=3.16.0",
    "httpx>=0.28.1",
    "langfuse>=4.14.4",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
